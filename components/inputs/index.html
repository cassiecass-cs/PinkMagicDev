<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inputs Rosa UI</title>
    <!-- Fuente Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="inputs.css">
</head>
<body style="padding: 30px; background-color: #fff5f7; font-family: 'Poppins', sans-serif; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;">

    <div>
        <label for="texto">Texto (text)</label>
        <input type="text" id="texto" placeholder="Escribe algo...">
    </div>

    <div>
        <label for="correo">Correo (email)</label>
        <input type="email" id="correo" placeholder="correo@ejemplo.com">
    </div>

    <div>
        <label for="password">Contraseña (password)</label>
        <input type="password" id="password" placeholder="••••••••">
    </div>

    <div>
        <label for="numero">Número (number)</label>
        <input type="number" id="numero" placeholder="0">
    </div>

    <div>
        <label for="fecha">Fecha (date)</label>
        <input type="date" id="fecha">
    </div>

    <div>
        <label for="buscar">Buscador (search)</label>
        <input type="search" id="buscar" placeholder="Buscar...">
    </div>

    <div>
        <label for="seleccion">Selector (select)</label>
        <select id="seleccion">
            <option value="">Elige una opción...</option>
            <option value="1">Opción 1</option>
            <option value="2">Opción 2</option>
        </select>
    </div>

    <div>
        <label for="area">Área de texto (textarea)</label>
        <textarea id="area" placeholder="Escribe un texto largo..."></textarea>
    </div>

    <div>
        <label for="archivo">Archivo (file)</label>
        <input type="file" id="archivo">
    </div>

    <div>
        <label for="rango">Rango (range)</label>
        <input type="range" id="rango" min="0" max="100" value="50">
    </div>

    <div style="display: flex; gap: 20px; align-items: center;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="checkbox" checked> Casilla (checkbox)
        </label>
        
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="radio" name="radio-group" checked> Opción (radio)
        </label>
    </div>

</body>
</html>
