<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Componente Rosa</title>
    <!-- Fuente Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="card">
        <div class="card-header">
            <h3 class="card-title">Título de la tarjeta</h3>
            <span class="card-subtitle">Subtítulo descriptivo</span>
        </div>
        <div class="card-body">
            <p>Este es el contenido principal dentro del cuerpo de la tarjeta, manteniendo la misma armonía visual, bordes redondeados y tonos rosa pastel.</p>
        </div>
    </div>

</body>
