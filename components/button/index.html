<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav component y Botones</title>
    <!-- Librería de iconos (Remix Icon) -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>
    <!-- Tus estilos CSS -->
    <link rel="stylesheet" href="buton.css">
</head>
<body>

    <!-- Contenido de ejemplo de tu página -->
    <div style="padding: 40px; font-family: 'Poppins', sans-serif; text-align: center;">
        <h1>Mi Página Estética</h1>
        <p>Aquí va el contenido principal de tu sitio web o tienda.</p>
        
        <!-- Ejemplo de uso de las variantes de botones -->
        <div style="display: flex; gap: 15px; justify-content: center; margin-top: 30px; flex-wrap: wrap;">
            <button class="btn button-primary">
                <i class="ri-heart-line"></i> Guardar
            </button>
            <button class="btn button-secondary">
                <i class="ri-arrow-left-line"></i> Volver
            </button>
            <button class="btn button-accent">
                <i class="ri-shopping-bag-line"></i> Comprar ahora
            </button>
        </div>
    </div>

    <!-- Menú de navegación fijo en el borde inferior -->
    <nav class="nav">
        <ul class="nav-list">
            <li class="nav-option">
                <i class="ri-home-heart-line"></i>
                <span>Inicio</span>
            </li>
            <li class="nav-option">
                <i class="ri-shopping-bag-3-line"></i>
                <span>Catálogo</span>
            </li>
            <li class="nav-option">
                <i class="ri-chat-smile-3-line"></i>
                <span>Contacto</span>
            </li>
        </ul>
    </nav>

</body>
</html>
